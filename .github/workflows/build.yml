name: U60 基线内核编译（纯编译）

# 重构后：本仓库只负责 clone → config → make → 上传产物。
#   ★ 零源码补丁、零 sed、零静态扫描、零 CRC / 符号 / dts 比对
#   ★ 内核源码仓库 = 通用 ALPS 基线 + 所有适配作为 commit 提交上去
#   ★ 本阶段目标只有一个：build OK；分析阶段以后再启用 diff_report.py
#
# 为什么用 docker run 而不是 runs-on: ubuntu-20.04：
#   GitHub 托管的 20.04 runner 已于 2025-04-15 退役；
#   而 MTK DrvGen 需要 python2，只有 focal 的 universe 里还有现成包。
#   所以：宿主 ubuntu-24.04 + 容器 ubuntu:20.04，依赖首次构建后固化在 GHCR。

on:
  workflow_dispatch:
    inputs:
      KERNEL_REPO:
        description: '内核源码仓库（由「初始化」workflow 建出来的那个）'
        required: true
        default: 'https://github.com/mmbsmm-git/YOUXUEPAI_U60_Kernel'
      KERNEL_REF:
        description: '分支 / tag / sha'
        required: true
        default: 'main'
      BUILD_KERNEL:
        description: '是否真的编译'
        required: true
        type: choice
        options: ['true', 'false']
        default: 'true'
      CLANG_URL:
        description: 'clang-4691093 包地址（googlesource 不通时换镜像）'
        required: true
        default: 'https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/android-9.0.0_r1/clang-4691093.tar.gz'

jobs:
  build:
    name: 编译 U60 基线内核
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write      # 推 GHCR 预构建镜像
    env:
      # Dockerfile / install-deps.sh 没改 → 镜像继续复用，不用换 tag
      IMAGE_TAG: u60-kernel-4.4-builder:latest

    steps:
    - name: 显示运行参数
      run: |
        echo "::group::参数"
        echo "KERNEL_REPO  : ${{ github.event.inputs.KERNEL_REPO }}"
        echo "KERNEL_REF   : ${{ github.event.inputs.KERNEL_REF }}"
        echo "BUILD_KERNEL : ${{ github.event.inputs.BUILD_KERNEL }}"
        echo "CLANG_URL    : ${{ github.event.inputs.CLANG_URL }}"
        echo "::endgroup::"

    - name: 检出仓库 (Check Out)
      uses: actions/checkout@v4

    - name: 清理环境（保留 Docker）
      uses: rokibhasansagar/slimhub_actions@main
      with:
        retain: "docker_buildkit,docker_imgcache"

    - name: 初始化工作目录
      id: pwd
      run: |
        mkdir -p workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> "$GITHUB_OUTPUT"

    - name: 设置交换空间 (Swap)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: 拉取预构建镜像（不存在才构建并固化一次）
      run: |
        set -e
        REPO_LOWER=$(echo "${{ github.repository }}" | tr 'A-Z' 'a-z')
        IMAGE="ghcr.io/${REPO_LOWER}/${IMAGE_TAG}"
        echo "Using image: $IMAGE"
        echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

        echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
        export DOCKER_BUILDKIT=1
        if docker pull "$IMAGE"; then
          echo "使用 GHCR 现成镜像（依赖已固化）: $IMAGE"
        else
          echo "GHCR 暂无镜像，构建并推送（仅首次）..."
          docker build --cache-from "$IMAGE" -t "$IMAGE" -f Dockerfile .
          docker push "$IMAGE"
          echo "镜像已固化到 GHCR: $IMAGE"
        fi

    # /repo 只读放 baseline + scripts，/workspace 可写放工具链 / 源码 / 输出。
    # 主逻辑放在 scripts/build.sh，YAML 里不塞大段 shell。
    - name: 容器内 clone / 配置 / 编译
      run: |
        set -e
        WS="${{ steps.pwd.outputs.workspace-folder }}"
        docker run --rm \
          -v "$WS:/workspace" \
          -v "${{ github.workspace }}:/repo:ro" \
          -e KERNEL_REPO="${{ github.event.inputs.KERNEL_REPO }}" \
          -e KERNEL_REF="${{ github.event.inputs.KERNEL_REF }}" \
          -e BUILD_KERNEL="${{ github.event.inputs.BUILD_KERNEL }}" \
          -e CLANG_URL="${{ github.event.inputs.CLANG_URL }}" \
          "$IMAGE" bash -e -c 'bash /repo/scripts/build.sh'

    - name: 写入 Step Summary
      if: always()
      run: |
        SUM="${{ steps.pwd.outputs.workspace-folder }}/out/summary.md"
        if [ -f "$SUM" ]; then
          cat "$SUM" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "## U60 基线内核（纯编译）" >> "$GITHUB_STEP_SUMMARY"
          echo "summary 未生成，请看上方日志与 Artifact。" >> "$GITHUB_STEP_SUMMARY"
        fi

    - name: 上传产物与日志 (Artifact)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: u60-kernel-build-${{ github.run_id }}
        retention-days: 30
        if-no-files-found: warn
        path: |
          ${{ steps.pwd.outputs.workspace-folder }}/out/summary.md
          ${{ steps.pwd.outputs.workspace-folder }}/out/steps.tsv
          ${{ steps.pwd.outputs.workspace-folder }}/out/artifacts/
          ${{ steps.pwd.outputs.workspace-folder }}/out/logs/
